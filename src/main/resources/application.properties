# Server
server.port=8080

# Database (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/filepilot_db}
spring.datasource.username=${DB_USERNAME:filepilot}
spring.datasource.password=${DB_PASSWORD:filepilot123}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET:myDefaultDevSecretKeyThatIsAtLeast256BitsLong!!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}

# Rate Limiting
rate.limit.requests=${RATE_LIMIT:120}
rate.limit.window=${RATE_LIMIT_WINDOW:60000}
rate.limit.auth.requests=${RATE_LIMIT_AUTH:15}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Actuator (health checks)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
