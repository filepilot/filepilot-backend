spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is owned by Flyway in prod; JPA only validates that mapped entities match.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway. baseline-on-migrate lets us adopt migrations on a database that already
# exists (built previously by ddl-auto=update) without re-running V1.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration
spring.jackson.serialization.write-dates-as-timestamps=false

server.port=${PORT:8080}

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Production runs behind a load balancer / reverse proxy. Trust X-Forwarded-For for rate limiting.
app.trusted-proxy=true

logging.level.com.filepilot=WARN
logging.level.org.springframework.security=WARN
